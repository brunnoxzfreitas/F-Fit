name: Deploy Backend to Render

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy and wait
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "RENDER_API_KEY and RENDER_SERVICE_ID must be set in repository secrets";
            exit 1;
          fi

          sudo apt-get update -y
          sudo apt-get install -y jq curl

          echo "Triggering deploy for Render service $RENDER_SERVICE_ID"
          DEPLOY_JSON=$(curl -s -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")

          echo "$DEPLOY_JSON" | jq -r '.'
          DEPLOY_ID=$(echo "$DEPLOY_JSON" | jq -r '.id')
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "Failed to create deploy. Response:"; echo "$DEPLOY_JSON"; exit 1;
          fi

          echo "Deploy id: $DEPLOY_ID"

          # Poll deploy status
          ATTEMPTS=0
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=5
          STATUS=""
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            sleep $SLEEP_SECONDS
            ((ATTEMPTS++))
            RESP=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")
            STATUS=$(echo "$RESP" | jq -r '.status // .state // empty')
            echo "Attempt $ATTEMPTS: deploy status = $STATUS"
            if [ "$STATUS" = "success" ] || [ "$STATUS" = "succeeded" ] || [ "$STATUS" = "finished" ]; then
              echo "Deploy succeeded"
              break
            fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ] || [ "$STATUS" = "error" ]; then
              echo "Deploy failed with status: $STATUS"
              echo "$RESP" | jq -r '.'
              exit 1
            fi
          done

          if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo "Timed out waiting for deploy to finish"; exit 1;
          fi

          # Fetch service info and try to extract public URL
          SERVICE_JSON=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$RENDER_SERVICE_ID")
          echo "Service info:"; echo "$SERVICE_JSON" | jq -r '.'
          SERVICE_URL=$(echo "$SERVICE_JSON" | jq -r '.serviceDetails.url // .serviceDetails.defaultDomain // .url // empty')
          if [ -n "$SERVICE_URL" ]; then
            echo "Service URL: $SERVICE_URL"
            echo "::set-output name=service_url::$SERVICE_URL"
            echo "Dispatching Pages workflow to rebuild frontend with new APP_URL"
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/gh-pages.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"app_url\":\"$SERVICE_URL\"}}"
          else
            echo "Could not determine service URL from API response. See service info above."
          fi
