name: Deploy from ci/gh-pages branch

on:
  push:
    branches:
      - ci/gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check Node / NPM
        run: |
          node -v
          npm -v

      - name: Show workspace
        run: |
          pwd
          ls -la

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
        env:
          CI: true

      - name: Show node_modules and package.json
        run: |
          ls -la node_modules || true
          node -v
          npm -v
          echo "--- package.json ---"
          cat package.json

      - name: Build (with verbose output)
        run: |
          npm run build 2>&1 | tee build.log || true
          echo "--- tail build log ---"
          tail -n 200 build.log || true
          # fail if build log contains 'error' to mark job failing
          if grep -i "error" build.log; then
            echo "Build contained errors";
            exit 1;
          fi

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main

      - name: Copy build to `docs` folder
        run: |
          rm -rf repo-main/docs || true
          mkdir -p repo-main/docs
          cp -a dist/. repo-main/docs/

      - name: Commit and push to `main`
        run: |
          cd repo-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: publish dist to docs [skip ci]" || echo "no changes to commit"
          git push origin main
