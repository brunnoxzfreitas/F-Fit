name: Deploy from ci/gh-pages branch

on:
  push:
    branches:
      - ci/gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check Node / NPM
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main

      - name: Copy build to `docs` folder
        run: |
          rm -rf repo-main/docs || true
          mkdir -p repo-main/docs
          cp -a dist/. repo-main/docs/

      - name: Commit and push to `main`
        run: |
          cd repo-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: publish dist to docs [skip ci]" || echo "no changes to commit"
          git push origin main
